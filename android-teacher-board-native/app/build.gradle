plugins {
    id "com.android.application"
}

android {
    namespace "com.mrmohamed.teacherboard.nativeclean"
    compileSdk 35

    defaultConfig {
        applicationId "com.mrmohamed.teacherboard.nativeclean"
        minSdk 29
        targetSdk 33
        versionCode 5
        versionName "4.1-phone-login"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {}
