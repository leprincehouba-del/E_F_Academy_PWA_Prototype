plugins { id "com.android.application" }
android {
    namespace "com.mrmohamed.teacherboard"
    compileSdk 35
    defaultConfig { applicationId "com.mrmohamed.teacherboard"; minSdk 23; targetSdk 35; versionCode 32; versionName "0.32-frontbuffer-eraser" }
    buildTypes { release { minifyEnabled false; proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro" } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation "com.github.mhiew:android-pdf-viewer:3.2.0-beta.3"
    implementation "androidx.graphics:graphics-core:1.0.4"
}
