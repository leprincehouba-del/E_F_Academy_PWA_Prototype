name: Teacher board v44

on:
  push:
    branches:
      - feature-teacher-pdf-board-20260904

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-teacher-pdf-board-20260904
          fetch-depth: 0

      - name: Apply v44 patch
        run: python3 .github/scripts/patch_teacher_board_v44.py

      - name: Validate
        run: |
          node --check teacher-board.js
          node --check app.js
          git diff --check
          grep -q 'alpha: true' teacher-board.js
          grep -q 'teacherBoardFullscreenToolBtn' index.html
          grep -q 'ef-academy-v44' service-worker.js

      - name: Commit and clean temporary helpers
        run: |
          rm -f .github/workflows/teacher-board-v44.yml .github/scripts/patch_teacher_board_v44.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix black ink overlay and expose fullscreen on Hikvision'
          git push origin HEAD:feature-teacher-pdf-board-20260904
