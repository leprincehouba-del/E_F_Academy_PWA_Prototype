name: Update teacher board PR7

on:
  push:
    branches:
      - feature-teacher-pdf-board-20260904

permissions:
  contents: write

jobs:
  update-board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature-teacher-pdf-board-20260904

      - name: Restore board on latest main
        run: |
          set -euo pipefail
          git fetch origin backup-teacher-pdf-board-pr7-20260906
          git diff de9970fde067efcd55ec2856ccdcfef8186be230..origin/backup-teacher-pdf-board-pr7-20260906 -- index.html styles.css teacher-board.js supabase/migrations/20260904000200_add_owner_teacher_board_points.sql > /tmp/board.patch
          git apply --3way /tmp/board.patch

      - name: Apply classroom fixes
        run: python3 .github/scripts/update_teacher_board.py

      - name: Validate
        run: |
          node --check teacher-board.js
          node --check app.js
          git diff --check

      - name: Commit board update
        run: |
          rm -f .github/workflows/update-teacher-board-pr7.yml .github/scripts/update_teacher_board.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve teacher PDF board classroom performance"
          git push origin HEAD:feature-teacher-pdf-board-20260904
