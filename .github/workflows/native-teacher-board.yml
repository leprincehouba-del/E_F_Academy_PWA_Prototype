name: Native Teacher Board APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-teacher-board/**"
      - "android-teacher-board.zip"
      - ".github/workflows/native-teacher-board.yml"

jobs:
  build-native-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Expand native project archive
        if: ${{ hashFiles('android-teacher-board.zip') != '' }}
        run: |
          rm -rf android-teacher-board
          unzip -q android-teacher-board.zip

      - name: Build debug APK
        run: gradle -p android-teacher-board assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TeacherBoardNative-preview
          path: android-teacher-board/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
