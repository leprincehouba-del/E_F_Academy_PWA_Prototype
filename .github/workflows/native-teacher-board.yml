name: Native Teacher Board APK
on:
  workflow_dispatch:
  push:
    paths:
      - "android-teacher-board/**"
      - ".github/workflows/native-teacher-board.yml"
jobs:
  build-native-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android platform
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle -p android-teacher-board assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TeacherBoardNative-v17-WindowLiveInk
          path: android-teacher-board/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
