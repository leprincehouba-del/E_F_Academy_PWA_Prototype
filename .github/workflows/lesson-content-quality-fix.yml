name: Lesson content quality fix

on:
  push:
    branches:
      - fix-lesson-content-extraction-parent-audio-20260910

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-lesson-content-extraction-parent-audio-20260910
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply lesson content patch
        run: python tools/patch_lesson_content_quality.py

      - name: Validate JavaScript syntax
        run: node --check app.js

      - name: Validate lesson content behavior markers
        shell: bash
        run: |
          grep -q 'lessonOcrPdfPageHasImages' app.js
          grep -q 'mergeLessonOcrSources' app.js
          grep -q 'lessonOcrLooksLikeNoise' app.js
          grep -q 'lesson-vocabulary-play' app.js
          grep -q 'اضغط على أي كلمة داخل النص لسماعها منفردة' app.js
          grep -q 'Lesson content: make individual-word audio obvious' styles.css
          grep -q 'ef-academy-v44' service-worker.js

      - name: Commit tested fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js styles.css service-worker.js
          git commit -m 'Fix lesson extraction and per-word parent audio'
          git push origin HEAD:fix-lesson-content-extraction-parent-audio-20260910
