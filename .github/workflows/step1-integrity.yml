name: App integrity validation

on:
  push:
    branches:
      - fix-integrity-sync-performance-v2-20260909

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate app JavaScript
        run: node --check app.js
      - name: Validate service worker JavaScript
        run: node --check service-worker.js
      - name: Guard stale absolute points overwrite
        run: "! grep -q 'points_balance: s.points' app.js"
      - name: Confirm safe attendance account RPC
        run: grep -q 'save_safe_attendance_with_account' app.js
