name: Finalize attendance
on:
  push:
    branches:
      - fix-attendance-live-sync-20260906
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-attendance-live-sync-20260906
          fetch-depth: 0
      - run: python3 tools/finalize_attendance_sync.py
      - run: node --check app.js
      - run: git diff --check
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Fix and validate attendance warning JavaScript"
          git push origin HEAD:fix-attendance-live-sync-20260906
