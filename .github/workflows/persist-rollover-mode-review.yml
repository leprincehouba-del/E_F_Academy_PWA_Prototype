name: Persist attendance rollover mode

on:
  push:
    branches:
      - fix-manager-date-rollover-20260907

permissions:
  contents: write

jobs:
  persist-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-manager-date-rollover-20260907
          fetch-depth: 0

      - name: Persist intentional historical-date mode
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('app.js')
          app = path.read_text(encoding='utf-8')

          old_save = '''      activePage,\n      pageFields: collectWorkspaceFields(pageRoot),\n      attendanceDrafts,\n'''
          new_save = '''      activePage,\n      pageFields: collectWorkspaceFields(pageRoot),\n      attendanceDateAutoFollowToday,\n      attendanceDrafts,\n'''
          if old_save not in app:
              raise SystemExit('workspace save marker not found')
          app = app.replace(old_save, new_save, 1)

          old_restore = '''  const restoredPageFields = adminWorkspaceFieldsForRestore(draft);\n  const restoredSessionDate = String(\n    restoredPageFields?.sessionDate?.value || ""\n  );\n  attendanceDateAutoFollowToday =\n    !restoredSessionDate || restoredSessionDate === localDateISO();\n\n  const desiredPage = pageIsAvailable(draft?.activePage)\n'''
          new_restore = '''  const restoredPageFields = adminWorkspaceFieldsForRestore(draft);\n  const draftSavedLocalDay = Number(draft?.savedAt || 0)\n    ? localDateISO(new Date(Number(draft.savedAt)))\n    : "";\n\n  // Only an explicit flag from a draft saved today may keep a historical date.\n  // Legacy/stale drafts default back to following today's date.\n  attendanceDateAutoFollowToday =\n    draftSavedLocalDay === localDateISO() &&\n    draft?.attendanceDateAutoFollowToday === false\n      ? false\n      : true;\n\n  const desiredPage = pageIsAvailable(draft?.activePage)\n'''
          if old_restore not in app:
              raise SystemExit('workspace restore marker not found')
          app = app.replace(old_restore, new_restore, 1)

          path.write_text(app, encoding='utf-8')
          PY

          node --check app.js
          git diff --check
          grep -q 'attendanceDateAutoFollowToday,' app.js
          grep -q 'draftSavedLocalDay' app.js

      - name: Commit reviewed persistence and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/persist-rollover-mode-review.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js .github/workflows/persist-rollover-mode-review.yml
          git commit -m 'Persist intentional historical attendance date mode'
          git push origin HEAD:fix-manager-date-rollover-20260907
