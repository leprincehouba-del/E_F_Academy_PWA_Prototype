name: Fix teacher board PDF viewer

on:
  push:
    branches:
      - feature-teacher-pdf-board-20260904

permissions:
  contents: write

jobs:
  patch-board:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-teacher-pdf-board-20260904
          fetch-depth: 0

      - name: Patch PDF viewer and file controls
        run: python3 .github/scripts/patch_teacher_board_pdf.py

      - name: Validate
        run: |
          node --check teacher-board.js
          node --check app.js
          git diff --check
          grep -q 'background: "rgb(255,255,255)"' teacher-board.js
          grep -q 'teacherBoardAddPdfBtn' index.html
          grep -q 'teacherBoardRemovePdfBtn' index.html
          grep -q 'teacherBoardGoPage' index.html
          grep -q 'ef-academy-v42' service-worker.js

      - name: Commit changes and remove temporary helpers
        run: |
          rm -f .github/workflows/fix-teacher-board-pdf-viewer.yml
          rm -f .github/scripts/patch_teacher_board_pdf.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix PDF rendering and expose file controls on teacher board'
          git push origin HEAD:feature-teacher-pdf-board-20260904
