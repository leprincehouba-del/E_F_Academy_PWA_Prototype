name: Step 4 schedule and cache hardening

on:
  push:
    branches:
      - fix-integrity-sync-performance-v2-20260909

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-integrity-sync-performance-v2-20260909
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply schedule and cache patch
        run: python tools/step4_correctness_patch.py
      - name: Validate app JavaScript syntax
        run: node --check app.js
      - name: Validate service worker syntax
        run: node --check service-worker.js
      - name: Confirm date-aware schedule helper
        run: grep -q 'groupSessionStartTime' app.js
      - name: Guard unquoted WhatsApp UUID handler
        run: "! grep -Fq 'onclick=\"sendWhatsApp(${s.id})\"' app.js"
      - name: Confirm new service worker cache
        run: grep -q 'ef-academy-v43' service-worker.js
      - name: Guard blocking cache write
        run: "! grep -q 'await cache.put' service-worker.js"
      - name: Commit step 4
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js service-worker.js
          git commit -m 'Use date-aware session times and reduce cache loading delay'
          git push origin HEAD:fix-integrity-sync-performance-v2-20260909
