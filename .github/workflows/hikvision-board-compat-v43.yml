name: Hikvision teacher board compatibility v43

on:
  push:
    branches:
      - feature-teacher-pdf-board-20260904

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-teacher-pdf-board-20260904
          fetch-depth: 0

      - name: Patch board
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          js = Path('teacher-board.js')
          text = js.read_text(encoding='utf-8')

          text = text.replace(
            '      const loadingTask = pdfjs.getDocument({ url: objectUrl });',
            '''      const loadingTask = pdfjs.getDocument({
        url: objectUrl,
        // Hikvision/Android WebView compatibility: avoid GPU-backed PDF.js
        // image/offscreen paths that can render scanned pages as black canvases.
        isOffscreenCanvasSupported: false,
        isImageDecoderSupported: false
      });''',
            1
          )

          old_ratio = '''      const deviceRatio = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
      const safeRatio = Math.sqrt(16_000_000 / Math.max(1, width * height));
      const pixelRatio = Math.min(deviceRatio, Math.max(0.5, safeRatio));'''
          new_ratio = '''      // Keep the PDF backing canvas at CSS resolution on Hikvision Android.
      // Large DPR canvases can turn completely black in some Android WebViews.
      const pixelRatio = 1;'''
          if old_ratio not in text:
            raise SystemExit('pixel ratio block not found')
          text = text.replace(old_ratio, new_ratio, 1)

          old_delete = '''  async function deleteBook(bookId) {
    const book = state.books.find(item => item.id === bookId);
    if (!book) return;

    if (!window.confirm(`حذف «${book.title}» وكتابته المحفوظة من هذه السبورة؟`)) {
      return;
    }

    try {
      if (state.currentBook?.id === bookId) await closeCurrentBook();
      await deleteBookData(bookId);
      const lastBookSetting = await dbGet("settings", "lastBookId");
      if (lastBookSetting?.value === bookId) {
        await dbDelete("settings", "lastBookId");
      }
      state.books = state.books.filter(item => item.id !== bookId);
      renderBooks();
      await updateStorageInfo();
      showToast("تم حذف الكتاب من هذه السبورة");
    } catch (error) {
      console.error("Teacher board book delete error:", error);
      showToast("تعذر حذف الكتاب");
    }
  }'''
          new_delete = '''  let removePdfArmedId = "";
  let removePdfArmedUntil = 0;

  async function deleteBook(bookId, sourceButton = null) {
    let book = state.books.find(item => item.id === bookId);
    if (!book && state.currentBook?.id === bookId) book = state.currentBook;
    if (!book) book = await dbGet("books", bookId);
    if (!book) {
      showToast("PDF not found on this board");
      return;
    }

    const now = Date.now();
    if (removePdfArmedId !== bookId || now > removePdfArmedUntil) {
      removePdfArmedId = bookId;
      removePdfArmedUntil = now + 4000;
      if (sourceButton) {
        sourceButton.dataset.originalLabel = sourceButton.innerHTML;
        sourceButton.innerHTML = "⚠ Confirm Remove";
      }
      showToast("اضغط Remove PDF مرة ثانية خلال 4 ثوانٍ للتأكيد");
      setTimeout(() => {
        if (Date.now() <= removePdfArmedUntil) return;
        removePdfArmedId = "";
        if (sourceButton?.dataset.originalLabel) {
          sourceButton.innerHTML = sourceButton.dataset.originalLabel;
          delete sourceButton.dataset.originalLabel;
        }
      }, 4200);
      return;
    }

    removePdfArmedId = "";
    removePdfArmedUntil = 0;

    try {
      if (state.currentBook?.id === bookId) await closeCurrentBook();
      await deleteBookData(bookId);
      const lastBookSetting = await dbGet("settings", "lastBookId");
      if (lastBookSetting?.value === bookId) {
        await dbDelete("settings", "lastBookId");
      }
      state.books = state.books.filter(item => item.id !== bookId);
      renderBooks();
      await updateStorageInfo();
      showToast("PDF removed from this board");
    } catch (error) {
      console.error("Teacher board book delete error:", error);
      showToast("Unable to remove PDF");
    } finally {
      if (sourceButton?.dataset.originalLabel) {
        sourceButton.innerHTML = sourceButton.dataset.originalLabel;
        delete sourceButton.dataset.originalLabel;
      }
    }
  }'''
          if old_delete not in text:
            raise SystemExit('deleteBook block not found')
          text = text.replace(old_delete, new_delete, 1)

          text = text.replace(
            '      el("teacherBoardPageCount").textContent = `/ ${state.pageCount}`;',
            '      el("teacherBoardPageCount").textContent = `of ${state.pageCount}`;',
            1
          )

          old_remove_bind = '''    el("teacherBoardRemovePdfBtn")?.addEventListener("click", () => {
      if (state.currentBook?.id) deleteBook(state.currentBook.id);
    });'''
          new_remove_bind = '''    el("teacherBoardRemovePdfBtn")?.addEventListener("click", event => {
      if (state.currentBook?.id) deleteBook(state.currentBook.id, event.currentTarget);
    });'''
          if old_remove_bind not in text:
            raise SystemExit('remove bind block not found')
          text = text.replace(old_remove_bind, new_remove_bind, 1)

          text = text.replace(
            '      button.addEventListener("click", () => deleteBook(button.dataset.deleteBook));',
            '      button.addEventListener("click", () => deleteBook(button.dataset.deleteBook, button));',
            1
          )

          old_fullscreen = '''    el("teacherBoardFullscreenBtn")?.addEventListener("click", async () => {
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else {
          await el("teacherBoard").querySelector(".teacher-board-shell").requestFullscreen();
          const orientationLock = screen.orientation?.lock?.("landscape");
          await orientationLock?.catch?.(() => {});
        }
      } catch {
        showToast("المتصفح لا يسمح بملء الشاشة الآن");
      }
    });'''
          new_fullscreen = '''    const toggleBoardFullscreen = async () => {
      const shell = el("teacherBoard")?.querySelector(".teacher-board-shell");
      if (!shell) return;

      const pseudoActive = shell.classList.contains("teacher-board-pseudo-fullscreen");
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else if (pseudoActive) {
          shell.classList.remove("teacher-board-pseudo-fullscreen");
          document.body.classList.remove("teacher-board-fullscreen-active");
        } else if (typeof shell.requestFullscreen === "function") {
          await shell.requestFullscreen();
          const orientationLock = screen.orientation?.lock?.("landscape");
          await orientationLock?.catch?.(() => {});
        } else {
          shell.classList.add("teacher-board-pseudo-fullscreen");
          document.body.classList.add("teacher-board-fullscreen-active");
        }
      } catch {
        shell.classList.toggle("teacher-board-pseudo-fullscreen");
        document.body.classList.toggle(
          "teacher-board-fullscreen-active",
          shell.classList.contains("teacher-board-pseudo-fullscreen")
        );
      }
      setTimeout(() => scheduleRender(), 80);
    };

    el("teacherBoardFullscreenBtn")?.addEventListener("click", toggleBoardFullscreen);
    el("teacherBoardFullscreenFloatingBtn")?.addEventListener("click", toggleBoardFullscreen);
    document.addEventListener("fullscreenchange", () => setTimeout(() => scheduleRender(), 80));'''
          if old_fullscreen not in text:
            raise SystemExit('fullscreen bind block not found')
          text = text.replace(old_fullscreen, new_fullscreen, 1)

          js.write_text(text, encoding='utf-8')

          html = Path('index.html')
          h = html.read_text(encoding='utf-8')
          viewer_marker = '''      <div id="teacherBoardViewer" class="teacher-board-viewer">
        <div id="teacherBoardWelcome" class="teacher-board-welcome">'''
          viewer_new = '''      <div id="teacherBoardViewer" class="teacher-board-viewer">
        <button id="teacherBoardFullscreenFloatingBtn" type="button" class="teacher-board-floating-fullscreen" title="Fullscreen">⛶ Fullscreen</button>
        <div id="teacherBoardWelcome" class="teacher-board-welcome">'''
          if viewer_marker not in h:
            raise SystemExit('viewer marker not found')
          h = h.replace(viewer_marker, viewer_new, 1)
          h = h.replace('<span id="teacherBoardPageCount">/ 0</span>', '<span id="teacherBoardPageCount">of 0</span>', 1)
          html.write_text(h, encoding='utf-8')

          css = Path('styles.css')
          c = css.read_text(encoding='utf-8')
          c += '''\n\n/* Teacher board Hikvision compatibility v43 */
.teacher-board-pages{direction:ltr!important;align-items:center!important;}
.teacher-board-pages label{direction:ltr!important;display:flex!important;align-items:center!important;gap:6px!important;margin:0!important;}
#teacherBoardPageNumber{width:86px!important;min-width:86px!important;text-align:center!important;direction:ltr!important;}
#teacherBoardPageCount{min-width:62px;text-align:center;direction:ltr;white-space:nowrap;}
#teacherBoardGoPage{min-width:54px;}
.teacher-board-viewer{position:relative;}
.teacher-board-floating-fullscreen{position:absolute;left:10px;top:10px;z-index:18;border:1px solid rgba(255,255,255,.55);background:rgba(15,38,32,.82);color:#fff;border-radius:12px;padding:9px 12px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.18);}
.teacher-board-pseudo-fullscreen{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;z-index:99999!important;border-radius:0!important;margin:0!important;}
body.teacher-board-fullscreen-active{overflow:hidden!important;}
@media(max-width:1100px){.teacher-board-header-actions{flex-wrap:wrap!important;}.teacher-board-floating-fullscreen{display:block!important;}}
'''
          css.write_text(c, encoding='utf-8')

          sw = Path('service-worker.js')
          s = sw.read_text(encoding='utf-8')
          if 'const CACHE = "ef-academy-v42";' not in s:
            raise SystemExit('v42 cache marker not found')
          s = s.replace('const CACHE = "ef-academy-v42";', 'const CACHE = "ef-academy-v43";', 1)
          sw.write_text(s, encoding='utf-8')
          PY

          node --check teacher-board.js
          node --check app.js
          git diff --check
          grep -q 'isImageDecoderSupported: false' teacher-board.js
          grep -q 'const pixelRatio = 1' teacher-board.js
          grep -q 'teacherBoardFullscreenFloatingBtn' index.html
          grep -q 'Confirm Remove' teacher-board.js
          grep -q 'ef-academy-v43' service-worker.js

      - name: Commit and clean helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/hikvision-board-compat-v43.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Hikvision PDF display, removal, page jump, and fullscreen'
          git push origin HEAD:feature-teacher-pdf-board-20260904
