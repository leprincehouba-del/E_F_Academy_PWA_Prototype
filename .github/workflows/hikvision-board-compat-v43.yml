name: Hikvision teacher board compatibility v43
on:
  push:
    branches:
      - feature-teacher-pdf-board-20260904
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-teacher-pdf-board-20260904
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          echo ' xKQp...TRUNCATED_FOR_BREVITY...' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          node --check teacher-board.js
          node --check app.js
          git diff --check
          grep -q 'isImageDecoderSupported: false' teacher-board.js
          grep -q 'teacherBoardFullscreenFloatingBtn' index.html
          grep -q 'ef-academy-v43' service-worker.js
      - name: Commit changes
        shell: bash
        run: |
          rm -f .github/workflows/hikvision-board-compat-v43.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Hikvision PDF display, removal, page jump, and fullscreen'
          git push origin HEAD:feature-teacher-pdf-board-20260904
