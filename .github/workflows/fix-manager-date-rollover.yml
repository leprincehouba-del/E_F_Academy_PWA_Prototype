name: Fix manager attendance date rollover

on:
  push:
    branches:
      - fix-manager-date-rollover-20260907

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-manager-date-rollover-20260907
          fetch-depth: 0

      - name: Apply safe date rollover fix
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          app_path = Path('app.js')
          sw_path = Path('service-worker.js')

          app = app_path.read_text(encoding='utf-8')
          sw = sw_path.read_text(encoding='utf-8')

          declaration = '''const ATTENDANCE_LIVE_SYNC_INTERVAL_MS = 5000;\nlet managerPointsLiveSyncBusy = false;\nlet attendancePendingPointsLiveSyncBusy = false;\n'''
          replacement = '''const ATTENDANCE_LIVE_SYNC_INTERVAL_MS = 5000;\nlet attendanceObservedLocalDay = localDateISO();\nlet attendanceDateRolloverBusy = false;\nlet managerPointsLiveSyncBusy = false;\nlet attendancePendingPointsLiveSyncBusy = false;\n'''
          if declaration not in app:
              raise SystemExit('live sync declaration marker not found')
          app = app.replace(declaration, replacement, 1)

          old = '''async function runAttendanceLiveSync() {\n  await Promise.allSettled([\n    refreshManagerPointsAccessLive(),\n    refreshAttendancePendingPointsLive()\n  ]);\n}\n'''

          new = '''async function refreshAttendanceDateAfterDayChange() {\n  const currentLocalDay = localDateISO();\n  const previousLocalDay = attendanceObservedLocalDay || currentLocalDay;\n\n  if (currentLocalDay === previousLocalDay) return false;\n\n  attendanceObservedLocalDay = currentLocalDay;\n\n  const todayText = $("todayText");\n  if (todayText) {\n    todayText.textContent = new Date().toLocaleDateString(\n      "ar-EG",\n      { weekday: "long", year: "numeric", month: "long", day: "numeric" }\n    );\n  }\n\n  const dateInput = $("sessionDate");\n  const canManageAttendance =\n    currentAppRole === "owner" || attendanceAccountEditAllowed === true;\n\n  if (!dateInput || !canManageAttendance || attendanceDateRolloverBusy) {\n    return false;\n  }\n\n  const selectedDate = String(dateInput.value || "");\n\n  // If the user intentionally selected an older historical date, keep it.\n  // Auto-follow only when the field was still on the day that just ended.\n  if (selectedDate && selectedDate !== previousLocalDay) {\n    return false;\n  }\n\n  attendanceDateRolloverBusy = true;\n\n  try {\n    saveWorkspaceDraftNow();\n    dateInput.value = currentLocalDay;\n\n    if ($("attendance")?.classList.contains("active-page")) {\n      await loadAttendance();\n    }\n\n    scheduleWorkspaceDraftSave();\n    return true;\n  } catch (error) {\n    console.error("Attendance date rollover error:", error);\n    return false;\n  } finally {\n    attendanceDateRolloverBusy = false;\n  }\n}\n\nasync function runAttendanceLiveSync() {\n  const dateRolledOver = await refreshAttendanceDateAfterDayChange();\n\n  if (dateRolledOver) return;\n\n  await Promise.allSettled([\n    refreshManagerPointsAccessLive(),\n    refreshAttendancePendingPointsLive()\n  ]);\n}\n'''

          if old not in app:
              raise SystemExit('runAttendanceLiveSync marker not found')
          app = app.replace(old, new, 1)

          if 'const CACHE = "ef-academy-v40";' not in sw:
              raise SystemExit('service worker cache marker not found')
          sw = sw.replace('const CACHE = "ef-academy-v40";', 'const CACHE = "ef-academy-v41";', 1)

          app_path.write_text(app, encoding='utf-8')
          sw_path.write_text(sw, encoding='utf-8')
          PY

          node --check app.js
          git diff --check
          grep -q 'async function refreshAttendanceDateAfterDayChange()' app.js
          grep -q 'attendanceObservedLocalDay = localDateISO()' app.js
          grep -q 'const CACHE = "ef-academy-v41";' service-worker.js

      - name: Commit clean production diff
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-manager-date-rollover.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js service-worker.js .github/workflows/fix-manager-date-rollover.yml
          git commit -m 'Fix responsible manager date rollover at midnight'
          git push origin HEAD:fix-manager-date-rollover-20260907
