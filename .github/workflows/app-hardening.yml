name: App hardening patch

on:
  push:
    branches:
      - fix-data-integrity-sync-performance-20260909

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-data-integrity-sync-performance-20260909
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run hardening patch with diagnostics
        shell: bash
        run: |
          set +e
          python tools/app_hardening_patch.py > .patch-primary.txt 2>&1
          echo $? > .patch-primary-exit.txt
          python tools/fix_walaa_concurrency_patch.py > .patch-walaa.txt 2>&1
          echo $? > .patch-walaa-exit.txt
          node --check app.js > .patch-syntax.txt 2>&1
          echo $? > .patch-syntax-exit.txt
          exit 0
      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .patch-primary.txt .patch-primary-exit.txt .patch-walaa.txt .patch-walaa-exit.txt .patch-syntax.txt .patch-syntax-exit.txt app.js service-worker.js
          git commit -m 'Capture hardening diagnostics [hardening-bot]'
          git push origin HEAD:fix-data-integrity-sync-performance-20260909
