name: App hardening patch

on:
  push:
    branches:
      - fix-data-integrity-sync-performance-20260909

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-data-integrity-sync-performance-20260909
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed hardening changes
        run: python tools/app_hardening_patch.py
      - name: Syntax and regression guards
        shell: bash
        run: |
          node --check app.js
          node --check service-worker.js
          ! grep -q 'points_balance: s.points' app.js
          ! grep -q 'onclick="sendWhatsApp(${s.id})"' app.js
          grep -q 'save_safe_attendance_with_account' app.js
          grep -q 'refreshStudentSnapshotLive' app.js
          grep -q 'refreshParentDashboardLive' app.js
          grep -q 'groupSessionStartTime' app.js
          grep -q 'ef-academy-v43' service-worker.js
      - name: Commit hardening patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js service-worker.js
          git commit -m 'Harden points integrity, sync, and loading performance [hardening-bot]'
          git push origin HEAD:fix-data-integrity-sync-performance-20260909
