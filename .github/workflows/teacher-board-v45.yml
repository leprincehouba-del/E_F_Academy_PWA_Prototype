name: Fix work issues 20260909

on:
  push:
    branches:
      - fix-work-issues-20260909

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-work-issues-20260909
          fetch-depth: 0

      - name: Patch app
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')

          marker='const attendanceWorkspaceDirtyKeys = new Set();\n'
          if 'let attendanceLoadVersion = 0;' not in s:
              if marker not in s: raise SystemExit('load version marker missing')
              s=s.replace(marker, marker+'let attendanceLoadVersion = 0;\n', 1)

          old='''async function loadAttendance(){\n  const groupId = $("groupSelect").value;\n  const group = groupById(groupId);\n  if (!group) return;\n  const supabase = await getSupabase();\n'''
          new='''async function loadAttendance(){\n  const loadVersion = ++attendanceLoadVersion;\n  const groupId = $("groupSelect")?.value || "";\n  const selectedSessionDateAtStart = $("sessionDate")?.value || "";\n  const group = groupById(groupId);\n  if (!group || !selectedSessionDateAtStart) return;\n\n  const isCurrentAttendanceLoad = () =>\n    loadVersion === attendanceLoadVersion &&\n    String($("groupSelect")?.value || "") === String(groupId) &&\n    String($("sessionDate")?.value || "") === String(selectedSessionDateAtStart);\n\n  const supabase = await getSupabase();\n  if (!isCurrentAttendanceLoad()) return;\n'''
          if old not in s: raise SystemExit('loadAttendance start missing')
          s=s.replace(old,new,1)

          old='''const { data: isOwner, error: ownerCheckError } =\n  await supabase.rpc("is_owner");\n\nif (ownerCheckError) {'''
          new='''const { data: isOwner, error: ownerCheckError } =\n  await supabase.rpc("is_owner");\n\nif (!isCurrentAttendanceLoad()) return;\n\nif (ownerCheckError) {'''
          if old not in s: raise SystemExit('owner check marker missing')
          s=s.replace(old,new,1)

          old='''await refreshWalaaSessionAccessControl();\n\n  $("selectedPrice").innerHTML = isOwner'''
          new='''await refreshWalaaSessionAccessControl();\nif (!isCurrentAttendanceLoad()) return;\n\n  $("selectedPrice").innerHTML = isOwner'''
          if old not in s: raise SystemExit('walaa refresh marker missing')
          s=s.replace(old,new,1)

          s=s.replace('  const sessionDate = $("sessionDate")?.value;\n  const startTime = normalizeSessionStartTime(group.time);','  const sessionDate = selectedSessionDateAtStart;\n  const startTime = normalizeSessionStartTime(group.time);',1)

          old='''    const { session: sessionData } = await findSessionForGroupDate(\n      supabase,\n      group.dbId,\n      sessionDate,\n      startTime,\n      "id, status, start_time"\n    );\n\n    existingSessionForLoad = sessionData || null;'''
          new='''    const { session: sessionData } = await findSessionForGroupDate(\n      supabase,\n      group.dbId,\n      sessionDate,\n      startTime,\n      "id, status, start_time"\n    );\n\n    if (!isCurrentAttendanceLoad()) return;\n    existingSessionForLoad = sessionData || null;'''
          if old not in s: raise SystemExit('session restore marker missing')
          s=s.replace(old,new,1)

          old='''      const { data: attendanceData, error: attendanceLoadError } = await supabase\n        .from("attendance")\n        .select("student_id, attendance_status, payment_status, points_change, points_details, package_id, package_consumed")\n        .eq("session_id", existingSessionForLoad.id);\n\n      if (attendanceLoadError) throw attendanceLoadError;'''
          new='''      const { data: attendanceData, error: attendanceLoadError } = await supabase\n        .from("attendance")\n        .select("student_id, attendance_status, payment_status, points_change, points_details, package_id, package_consumed")\n        .eq("session_id", existingSessionForLoad.id);\n\n      if (!isCurrentAttendanceLoad()) return;\n      if (attendanceLoadError) throw attendanceLoadError;'''
          if old not in s: raise SystemExit('attendance query marker missing')
          s=s.replace(old,new,1)

          old='''  } = await supabase.rpc(\n    "get_owner_pending_session_points",\n    {\n     p_group_id: group.dbId,\n      p_session_date: $("sessionDate").value\n    }\n  );\n\n  if (pendingError) {'''
          new='''  } = await supabase.rpc(\n    "get_owner_pending_session_points",\n    {\n      p_group_id: group.dbId,\n      p_session_date: selectedSessionDateAtStart\n    }\n  );\n\n  if (!isCurrentAttendanceLoad()) return;\n\n  if (pendingError) {'''
          if old not in s: raise SystemExit('pending points marker missing')
          s=s.replace(old,new,1)

          s=s.replace('const selectedSessionDate = $("sessionDate").value;\n','const selectedSessionDate = selectedSessionDateAtStart;\n',1)

          old='''const list =\n  isPastSessionDay && existingAttendanceByStudent.size > 0\n    ? groupStudents.filter(s =>\n        existingAttendanceByStudent.has(String(s.id))\n      )\n    : groupStudents;\n  $("attendanceBody").dataset.workspaceDraftKey ='''
          new='''const list =\n  isPastSessionDay && existingAttendanceByStudent.size > 0\n    ? groupStudents.filter(s =>\n        existingAttendanceByStudent.has(String(s.id))\n      )\n    : groupStudents;\n\n  if (!isCurrentAttendanceLoad()) return;\n\n  $("attendanceBody").dataset.workspaceDraftKey ='''
          if old not in s: raise SystemExit('attendance body marker missing')
          s=s.replace(old,new,1)

          old='''    const { data, error } = await supabase.rpc(\n      "set_manager_points_session_access",\n      {\n        p_group_id: group.dbId,\n        p_session_date: sessionDate,\n        p_is_open: shouldOpen\n      }\n    );\n\n    if (error) throw error;'''
          new='''    let { data, error } = await supabase.rpc(\n      "set_manager_points_session_access_for_attendance_editor",\n      {\n        p_group_id: group.dbId,\n        p_session_date: sessionDate,\n        p_is_open: shouldOpen\n      }\n    );\n\n    const missingEditorRpc = error && (\n      error.code === "PGRST202" ||\n      /set_manager_points_session_access_for_attendance_editor/i.test(String(error.message || ""))\n    );\n\n    if (missingEditorRpc) {\n      ({ data, error } = await supabase.rpc(\n        "set_manager_points_session_access",\n        {\n          p_group_id: group.dbId,\n          p_session_date: sessionDate,\n          p_is_open: shouldOpen\n        }\n      ));\n    }\n\n    if (error) throw error;'''
          if old not in s: raise SystemExit('walaa setter marker missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          sw=Path('service-worker.js')
          w=sw.read_text(encoding='utf-8')
          if 'const CACHE = "ef-academy-v41";' not in w: raise SystemExit('cache marker missing')
          sw.write_text(w.replace('const CACHE = "ef-academy-v41";','const CACHE = "ef-academy-v42";',1),encoding='utf-8')
          PY

          node --check app.js
          git diff --check
          grep -q 'let attendanceLoadVersion = 0;' app.js
          grep -q 'isCurrentAttendanceLoad' app.js
          grep -q 'set_manager_points_session_access_for_attendance_editor' app.js
          grep -q 'ef-academy-v42' service-worker.js

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/teacher-board-v45.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix attendance group race and Walaa access permissions'
          git push origin HEAD:fix-work-issues-20260909
