name: Teacher board v45

on:
  push:
    branches:
      - feature-teacher-pdf-board-20260904

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-teacher-pdf-board-20260904
          fetch-depth: 0

      - name: Patch board rendering, move and fullscreen
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path('teacher-board.js')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
            '    pdfRenderTask: null,\n    pageCache: new Map(),',
            '    pdfRenderTask: null,\n    pageBaseCanvas: null,\n    annotationCanvas: null,\n    panX: 0,\n    panY: 0,\n    pageCache: new Map(),',
            1
          )

          old_render = '''      [pdfCanvas, inkCanvas].forEach(canvas => {
        canvas.width = renderCanvas.width;
        canvas.height = renderCanvas.height;
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
      });
      // The ink canvas must stay transparent so the PDF remains visible below it.
      inkCanvas.style.background = "transparent";
      wrap.style.width = `${width}px`;
      wrap.style.height = `${height}px`;

      const pdfContext = pdfCanvas.getContext("2d", { alpha: false });
      if (!pdfContext) throw new Error("PDF_DISPLAY_CONTEXT_UNAVAILABLE");
      pdfContext.setTransform(1, 0, 0, 1, 0, 0);
      pdfContext.fillStyle = "#ffffff";
      pdfContext.fillRect(0, 0, pdfCanvas.width, pdfCanvas.height);
      pdfContext.drawImage(renderCanvas, 0, 0);

      state.strokes = strokes;'''
          new_render = '''      pdfCanvas.width = renderCanvas.width;
      pdfCanvas.height = renderCanvas.height;
      pdfCanvas.style.width = `${width}px`;
      pdfCanvas.style.height = `${height}px`;
      // Keep the old ink canvas only as a hidden compatibility element.
      // The visible page and annotations are composited onto one canvas to avoid
      // the opaque-black transparent-canvas bug on Hikvision Android.
      inkCanvas.width = renderCanvas.width;
      inkCanvas.height = renderCanvas.height;
      inkCanvas.style.display = "none";
      state.pageBaseCanvas = renderCanvas;
      wrap.style.width = `${width}px`;
      wrap.style.height = `${height}px`;

      state.strokes = strokes;'''
          if old_render not in s:
            raise SystemExit('render output block not found')
          s = s.replace(old_render, new_render, 1)

          start = s.find('  function redrawInk() {')
          end = s.find('\n  function setMode(mode)', start)
          if start < 0 or end < 0:
            raise SystemExit('redrawInk markers not found')
          new_redraw = '''  function redrawInk() {
    const canvas = el("teacherBoardPdfCanvas");
    const base = state.pageBaseCanvas;
    if (!canvas || !base || !canvas.width || !canvas.height) return;

    if (!state.annotationCanvas) state.annotationCanvas = document.createElement("canvas");
    const annotation = state.annotationCanvas;
    if (annotation.width !== canvas.width) annotation.width = canvas.width;
    if (annotation.height !== canvas.height) annotation.height = canvas.height;

    const annotationContext = annotation.getContext("2d", { alpha: true });
    if (!annotationContext) return;
    annotationContext.setTransform(1, 0, 0, 1, 0, 0);
    annotationContext.clearRect(0, 0, annotation.width, annotation.height);

    const rect = canvas.getBoundingClientRect();
    const cssWidth = Math.max(1, rect.width || canvas.width);
    const cssHeight = Math.max(1, rect.height || canvas.height);
    const ratio = canvas.width / cssWidth;
    annotationContext.setTransform(ratio, 0, 0, ratio, 0, 0);
    [
      ...state.strokes,
      ...(state.activeStroke ? [state.activeStroke] : [])
    ].forEach(stroke => drawStroke(annotationContext, stroke, cssWidth, cssHeight));
    annotationContext.setTransform(1, 0, 0, 1, 0, 0);

    const context = canvas.getContext("2d", { alpha: false });
    if (!context) return;
    context.setTransform(1, 0, 0, 1, 0, 0);
    context.globalCompositeOperation = "source-over";
    context.fillStyle = "#ffffff";
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.drawImage(base, 0, 0, canvas.width, canvas.height);
    context.drawImage(annotation, 0, 0, canvas.width, canvas.height);
  }
'''
          s = s[:start] + new_redraw + s[end:]

          old_ctx = '''  function drawingContext(canvas) {
    // Keep the annotation layer genuinely transparent on Hikvision/Android.
    // Some WebViews render desynchronized transparent canvases as opaque black.
    return canvas.getContext("2d", { alpha: true }) || canvas.getContext("2d");
  }'''
          new_ctx = '''  function drawingContext(canvas) {
    if (canvas?.id === "teacherBoardPdfCanvas") {
      return canvas.getContext("2d", { alpha: false }) || canvas.getContext("2d");
    }
    return canvas.getContext("2d", { alpha: true }) || canvas.getContext("2d");
  }'''
          if old_ctx not in s:
            raise SystemExit('drawingContext block not found')
          s = s.replace(old_ctx, new_ctx, 1)

          old_move = '''      const previousLength = stroke.points.length;
      const events = event.getCoalescedEvents?.() || [event];
      events.forEach(item => stroke.points.push(canvasPoint(item, canvas)));
      drawStrokeIncremental(canvas, stroke, Math.max(0, previousLength - 1));'''
          new_move = '''      const previousLength = stroke.points.length;
      const events = event.getCoalescedEvents?.() || [event];
      events.forEach(item => stroke.points.push(canvasPoint(item, canvas)));
      if (canvas.id === "teacherBoardPdfCanvas" && stroke.tool === "eraser") {
        // Erasing is recomposited from the untouched PDF + annotation layer so
        // the PDF itself can never be erased or turn black.
        options.redraw();
      } else {
        drawStrokeIncremental(canvas, stroke, Math.max(0, previousLength - 1));
      }'''
          if old_move not in s:
            raise SystemExit('pointer move block not found')
          s = s.replace(old_move, new_move, 1)

          old_finish = '''      options.commit(stroke);
      options.setActive(null);
      options.save();'''
          new_finish = '''      options.commit(stroke);
      options.setActive(null);
      options.redraw();
      options.save();'''
          if old_finish not in s:
            raise SystemExit('finish block not found')
          s = s.replace(old_finish, new_finish, 1)

          s = s.replace(
            '    bindDrawingCanvas(el("teacherBoardInkCanvas"), {',
            '    bindDrawingCanvas(el("teacherBoardPdfCanvas"), {',
            1
          )

          pan_code = '''
  function applyBoardPan() {
    const wrap = el("teacherBoardCanvasWrap");
    if (!wrap) return;
    wrap.style.transform = `translate(${state.panX}px, ${state.panY}px)`;
  }

  function resetBoardPan() {
    state.panX = 0;
    state.panY = 0;
    const wrap = el("teacherBoardCanvasWrap");
    if (wrap) wrap.style.transform = "";
  }

  function bindBoardPan() {
    const canvas = el("teacherBoardPdfCanvas");
    if (!canvas) return;
    let drag = null;

    canvas.addEventListener("pointerdown", event => {
      if (state.mode !== "move" || event.button > 0) return;
      event.preventDefault();
      drag = {
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        panX: state.panX,
        panY: state.panY
      };
      canvas.setPointerCapture?.(event.pointerId);
      canvas.classList.add("teacher-board-panning");
    }, { passive: false });

    canvas.addEventListener("pointermove", event => {
      if (!drag || drag.pointerId !== event.pointerId || state.mode !== "move") return;
      event.preventDefault();
      state.panX = drag.panX + (event.clientX - drag.startX);
      state.panY = drag.panY + (event.clientY - drag.startY);
      applyBoardPan();
    }, { passive: false });

    const finish = event => {
      if (!drag || drag.pointerId !== event.pointerId) return;
      drag = null;
      canvas.classList.remove("teacher-board-panning");
      try { canvas.releasePointerCapture?.(event.pointerId); } catch {}
    };
    canvas.addEventListener("pointerup", finish);
    canvas.addEventListener("pointercancel", finish);
  }

'''
          marker = '  function bindEvents() {'
          if marker not in s:
            raise SystemExit('bindEvents marker not found')
          s = s.replace(marker, pan_code + marker, 1)

          s = s.replace(
            '    state.pageNumber = pageNumber;\n    state.activeStroke = null;\n    await renderPage({ showLoading: false });',
            '    state.pageNumber = pageNumber;\n    state.activeStroke = null;\n    resetBoardPan();\n    await renderPage({ showLoading: false });',
            1
          )

          s = s.replace(
            '      state.zoom = 1;\n      updateBookUi();\n      scheduleRender();',
            '      state.zoom = 1;\n      resetBoardPan();\n      updateBookUi();\n      scheduleRender();',
            1
          )

          old_fs_start = s.find('    const toggleBoardFullscreen = async () => {')
          old_fs_end = s.find('    el("teacherBoardFullscreenBtn")?.addEventListener("click", toggleBoardFullscreen);', old_fs_start)
          if old_fs_start < 0 or old_fs_end < 0:
            raise SystemExit('fullscreen block markers not found')
          new_fs = '''    const setPseudoFullscreen = active => {
      const shell = el("teacherBoard")?.querySelector(".teacher-board-shell");
      if (!shell) return;
      shell.classList.toggle("teacher-board-pseudo-fullscreen", Boolean(active));
      document.body.classList.toggle("teacher-board-fullscreen-active", Boolean(active));
      const button = el("teacherBoardFullscreenBtn");
      if (button) button.innerHTML = active ? "✕ Exit Fullscreen" : "⛶ Fullscreen";
    };

    const toggleBoardFullscreen = async () => {
      const shell = el("teacherBoard")?.querySelector(".teacher-board-shell");
      if (!shell) return;
      const active = Boolean(document.fullscreenElement) || shell.classList.contains("teacher-board-pseudo-fullscreen");

      if (active) {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
        } catch {}
        setPseudoFullscreen(false);
      } else {
        // Enter our reliable in-page fullscreen immediately. Native browser
        // fullscreen is then attempted as a bonus, but is not required.
        setPseudoFullscreen(true);
        window.scrollTo?.(0, 0);
        try {
          if (document.fullscreenEnabled && typeof shell.requestFullscreen === "function") {
            await shell.requestFullscreen();
            const orientationLock = screen.orientation?.lock?.("landscape");
            await orientationLock?.catch?.(() => {});
          }
        } catch {}
      }
      setTimeout(() => scheduleRender(), 100);
    };
'''
          s = s[:old_fs_start] + new_fs + s[old_fs_end:]

          s = s.replace(
            '    bindEvents();\n    bindMiniDrag();',
            '    bindEvents();\n    bindMiniDrag();\n    bindBoardPan();',
            1
          )

          s = s.replace(
            '    state.pageCache.clear();\n    state.currentBook = null;',
            '    state.pageCache.clear();\n    state.pageBaseCanvas = null;\n    state.annotationCanvas = null;\n    resetBoardPan();\n    state.currentBook = null;',
            1
          )

          p.write_text(s, encoding='utf-8')

          css = Path('styles.css')
          c = css.read_text(encoding='utf-8')
          c += '''\n\n/* Teacher board v45: single visible canvas + real page dragging */
#teacherBoardInkCanvas{display:none!important;visibility:hidden!important;}
#teacherBoardPdfCanvas{position:relative;z-index:1;touch-action:none!important;cursor:crosshair;}
#teacherBoardPdfCanvas[data-mode="move"]{cursor:grab!important;}
#teacherBoardPdfCanvas.teacher-board-panning{cursor:grabbing!important;}
.teacher-board-canvas-wrap{transform-origin:center center;will-change:transform;}
.teacher-board-pseudo-fullscreen{background:#e9efec!important;display:grid!important;grid-template-rows:auto minmax(0,1fr)!important;}
.teacher-board-pseudo-fullscreen .teacher-board-main{min-height:0!important;}
.teacher-board-pseudo-fullscreen .teacher-board-viewer{height:100%!important;min-height:0!important;}
body.teacher-board-fullscreen-active .sidebar,
body.teacher-board-fullscreen-active .topbar{visibility:hidden!important;}
'''
          css.write_text(c, encoding='utf-8')

          sw = Path('service-worker.js')
          w = sw.read_text(encoding='utf-8')
          if 'const CACHE = "ef-academy-v44";' not in w:
            raise SystemExit('v44 cache marker not found')
          w = w.replace('const CACHE = "ef-academy-v44";', 'const CACHE = "ef-academy-v45";', 1)
          sw.write_text(w, encoding='utf-8')
          PY

          node --check teacher-board.js
          node --check app.js
          git diff --check
          grep -q 'bindDrawingCanvas(el("teacherBoardPdfCanvas")' teacher-board.js
          grep -q 'state.pageBaseCanvas = renderCanvas' teacher-board.js
          grep -q 'bindBoardPan' teacher-board.js
          grep -q 'setPseudoFullscreen(true)' teacher-board.js
          grep -q '#teacherBoardInkCanvas{display:none' styles.css
          grep -q 'ef-academy-v45' service-worker.js

      - name: Commit and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/teacher-board-v45.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use single visible PDF canvas and fix Move fullscreen'
          git push origin HEAD:feature-teacher-pdf-board-20260904
