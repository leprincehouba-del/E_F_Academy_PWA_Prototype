name: Teacher Board Native Clean APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-teacher-board-native/**"
      - ".github/workflows/native-teacher-board-clean.yml"
  pull_request:
    paths:
      - "android-teacher-board-native/**"
      - ".github/workflows/native-teacher-board-clean.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build debug APK
        run: gradle -p android-teacher-board-native assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TeacherBoard-Native-Clean-v1-Engine-Test
          path: android-teacher-board-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
