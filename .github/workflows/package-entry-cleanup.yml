name: Package entry cleanup

on:
  push:
    branches:
      - fix-integrity-sync-performance-v2-20260909

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-integrity-sync-performance-v2-20260909
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply package-entry cleanup
        run: python tools/remove_package_default_prefill.py
      - name: Validate app JavaScript
        run: node --check app.js
      - name: Validate package entry is explicit
        shell: bash
        run: |
          grep -q 'placeholder="اكتب عدد الحصص"' index.html
          grep -q 'input.value = "";' app.js
          ! grep -q 'purchaseSessionsInput.value = String(defaultPackageSessions)' app.js
      - name: Commit UI cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html
          git commit -m 'Require explicit session count for each package purchase'
          git push origin HEAD:fix-integrity-sync-performance-v2-20260909
