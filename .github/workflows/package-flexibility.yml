name: Package flexibility patch

on:
  push:
    branches:
      - fix-integrity-sync-performance-v2-20260909

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-integrity-sync-performance-v2-20260909
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply package flexibility patch
        run: python tools/package-flexibility_patch.py
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Validate flexible package UI and RPC
        shell: bash
        run: |
          grep -q 'id="packagePaymentSessions"' index.html
          grep -q 'purchase_student_session_package_custom' app.js
          grep -q 'p_sessions: sessions' app.js
          grep -q 'packagePurchaseSessionCount' app.js
          grep -q 'sessionPackageRequestSessions' app.js
          ! grep -q '"purchase_student_session_package",' app.js
      - name: Commit package flexibility
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html
          git commit -m 'Allow choosing session count for each package purchase'
          git push origin HEAD:fix-integrity-sync-performance-v2-20260909
