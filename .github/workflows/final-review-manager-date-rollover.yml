name: Final review manager attendance date rollover

on:
  push:
    branches:
      - fix-manager-date-rollover-20260907

permissions:
  contents: write

jobs:
  final-review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-manager-date-rollover-20260907
          fetch-depth: 0

      - name: Harden workspace save and verify rollover cases
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('app.js')
          app = path.read_text(encoding='utf-8')

          old = '''    saveWorkspaceDraftNow();\n    dateInput.value = currentLocalDay;\n    attendanceDateAutoFollowToday = true;\n\n    if ($("attendance")?.classList.contains("active-page")) {\n'''
          new = '''    // Save unsaved rows under the old date first, then immediately\n    // persist the new date so a crash/refresh cannot restore yesterday.\n    saveWorkspaceDraftNow();\n    dateInput.value = currentLocalDay;\n    attendanceDateAutoFollowToday = true;\n    saveWorkspaceDraftNow();\n\n    if ($("attendance")?.classList.contains("active-page")) {\n'''
          if old not in app:
              raise SystemExit('rollover save marker not found')
          app = app.replace(old, new, 1)
          path.write_text(app, encoding='utf-8')

          # Logic review: auto-follow current day; preserve deliberate history.
          def should_switch(current, previous, selected, auto_follow, can_manage=True):
              day_changed = current != previous
              should_follow = auto_follow or not selected or (day_changed and selected == previous)
              return can_manage and should_follow and selected != current

          assert should_switch('2026-09-07', '2026-09-06', '2026-09-06', True)
          assert should_switch('2026-09-07', '2026-09-07', '2026-09-06', True)
          assert not should_switch('2026-09-07', '2026-09-06', '2026-09-05', False)
          assert not should_switch('2026-09-07', '2026-09-07', '2026-09-05', False)
          assert not should_switch('2026-09-07', '2026-09-06', '2026-09-06', True, False)
          PY

          node --check app.js
          git diff --check
          grep -q 'saveWorkspaceDraftNow();' app.js
          grep -q 'attendanceDateAutoFollowToday = true;' app.js

      - name: Commit final reviewed version and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/final-review-manager-date-rollover.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js .github/workflows/final-review-manager-date-rollover.yml
          git commit -m 'Harden attendance date rollover workspace persistence'
          git push origin HEAD:fix-manager-date-rollover-20260907
