name: Wire teacher board into current app

on:
  push:
    branches:
      - feature-teacher-pdf-board-20260904

permissions:
  contents: write

jobs:
  wire-board:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-teacher-pdf-board-20260904
          fetch-depth: 0

      - name: Add current app integration
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('app.js')
          text = path.read_text(encoding='utf-8')

          if 'window.teacherBoard?.logout?.();' not in text:
              marker = '  stopLessonSpeech();\n'
              start = text.find('async function logout()')
              if start < 0:
                  raise SystemExit('logout function not found')
              pos = text.find(marker, start)
              if pos < 0:
                  raise SystemExit('logout marker not found')
              pos += len(marker)
              text = text[:pos] + '  window.teacherBoard?.logout?.();\n' + text[pos:]

          nav_start = text.find('function navigate(page, options = {})')
          if nav_start < 0:
              nav_start = text.find('function navigate(page')
          if nav_start < 0:
              raise SystemExit('navigate function not found')

          next_function = text.find('\nfunction ', nav_start + 20)
          nav_end = next_function if next_function >= 0 else len(text)
          nav_block = text[nav_start:nav_end]

          if 'window.teacherBoard?.activate?.();' not in nav_block:
              marker = '  if (!skipWorkspaceSave) {'
              rel = nav_block.find(marker)
              if rel < 0:
                  raise SystemExit('navigate save marker not found')
              insert = (
                  '  if (page === "teacherBoard") {\n'
                  '    window.teacherBoard?.activate?.();\n'
                  '  } else {\n'
                  '    window.teacherBoard?.deactivate?.();\n'
                  '  }\n\n'
              )
              abs_pos = nav_start + rel
              text = text[:abs_pos] + insert + text[abs_pos:]

          path.write_text(text, encoding='utf-8')
          PY

          node --check app.js
          node --check teacher-board.js
          grep -q 'id="teacherBoard"' index.html
          grep -q 'teacher-board.js' index.html
          git diff --check

      - name: Commit integration and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/wire-teacher-board-current-main.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Wire teacher board into current app navigation'
          git push origin HEAD:feature-teacher-pdf-board-20260904
