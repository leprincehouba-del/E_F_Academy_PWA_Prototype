name: Performance regression validation

on:
  push:
    branches:
      - fix-integrity-sync-performance-v2-20260909

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Confirm dashboard work is scoped
        run: grep -q 'dashboard.*active-page' app.js
      - name: Confirm bounded Walaa concurrency
        run: grep -q 'mapWithConcurrency(entries, 4' app.js
