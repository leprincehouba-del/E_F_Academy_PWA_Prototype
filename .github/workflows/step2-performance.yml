name: Step 2 performance hardening

on:
  push:
    branches:
      - fix-integrity-sync-performance-v2-20260909

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-integrity-sync-performance-v2-20260909
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply performance patch
        run: python tools/step2_performance_patch.py
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Confirm dashboard work is scoped
        run: grep -q 'dashboard.*active-page' app.js
      - name: Confirm bounded Walaa concurrency
        run: grep -q 'mapWithConcurrency(entries, 4' app.js
      - name: Commit step 2
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'Reduce hidden loading work and speed Walaa point queue'
          git push origin HEAD:fix-integrity-sync-performance-v2-20260909
