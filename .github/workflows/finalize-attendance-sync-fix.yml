name: Finalize attendance sync fix

on:
  push:
    branches:
      - fix-attendance-live-sync-20260906

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-attendance-live-sync-20260906
          fetch-depth: 0

      - name: Fix warning string and validate JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app.js')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r'!window\.confirm\(\n\s*"تنبيه مهم: تاريخ الحصة المختار ليس تاريخ اليوم\.[\s\S]*?"إذا كنت تسجل حصة قديمة عمدًا اضغط موافق، وإلا اضغط إلغاء وصحح التاريخ\."\n\s*\)',
              re.M
          )
          replacement = '''!window.confirm(
      "تنبيه مهم: تاريخ الحصة المختار ليس تاريخ اليوم.\\n\\n" +
      `التاريخ المختار: ${selectedSessionDateForWarning}\\n` +
      `تاريخ اليوم: ${todayForAttendanceSave}\\n\\n` +
      "إذا كنت تسجل حصة قديمة عمدًا اضغط موافق، وإلا اضغط إلغاء وصحح التاريخ."
    )'''

          text, count = pattern.subn(lambda _m: replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one historical-date warning block, found {count}')

          path.write_text(text, encoding='utf-8')
          PY

          node --check app.js
          git diff --check

      - name: Commit validated fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Validate attendance sync JavaScript"
          git push origin HEAD:fix-attendance-live-sync-20260906
