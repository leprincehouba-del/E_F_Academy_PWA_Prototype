<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Attendance Sync Test - E. F Academy</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #111; }
    #testFrame { width: 100%; height: 100%; border: 0; display: block; }
    #testBadge {
      position: fixed;
      z-index: 999999;
      left: 12px;
      bottom: 12px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(15, 23, 42, .9);
      color: #fff;
      font: 12px/1.4 system-ui, sans-serif;
      box-shadow: 0 4px 16px rgba(0,0,0,.25);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <iframe id="testFrame" src="./index.html?attendance-sync-test=1" title="E. F Academy attendance sync test"></iframe>
  <div id="testBadge">نسخة اختبار تزامن الحضور والنقاط</div>

  <script>
    const frame = document.getElementById("testFrame");

    frame.addEventListener("load", () => {
      try {
        const doc = frame.contentDocument;
        if (!doc || doc.getElementById("attendanceSyncFixLoader")) return;

        const script = doc.createElement("script");
        script.id = "attendanceSyncFixLoader";
        script.src = "./attendance-sync-fix.js";
        script.defer = true;
        doc.body.appendChild(script);
      } catch (error) {
        console.error("Attendance sync test loader error:", error);
      }
    });
  </script>
</body>
</html>
